<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DamiaProdan | Streams en vivo, juegos y comunidad</title>
  <meta name="description" content="Todo DamiaProdan en un solo lugar: streams en vivo de Twitch, últimos videos de YouTube, top de juegos jugados y una comunidad que opina y califica cada partida. Sumate al Discord.">
  <link rel="canonical" href="https://damiaprodan-oficial-rho.vercel.app/">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0d0716; --bg-2:#160b28; --panel:#1c1030; --panel-border:#3a2a5c; --pink:#ff2e88; --cyan:#00e5ff; --gold:#ffcc33; --text:#f2eefc; --text-dim:#a999c9; --twitch:#9146ff; --youtube:#ff3b3b; --kick:#53fc18; --trovo:#1cd3a2; --x:#e8e8e8; --discord:#5865f2; --font-display:'Press Start 2P', monospace; --font-body:'Space Grotesk', sans-serif; --font-mono:'JetBrains Mono', monospace; }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{background: radial-gradient(circle at 15% 10%, rgba(255,46,136,0.12), transparent 40%), radial-gradient(circle at 85% 30%, rgba(0,229,255,0.10), transparent 45%), var(--bg); color:var(--text); font-family:var(--font-body); overflow-x:hidden; min-height:100vh; }
    a{color:inherit;text-decoration:none;}
    nav{position:sticky;top:0;z-index:100; display:flex;align-items:center;justify-content:space-between; padding:18px 5vw; background:rgba(13,7,22,0.75); backdrop-filter:blur(10px); border-bottom:1px solid var(--panel-border); }
    .logo{font-family:var(--font-display); font-size:14px; color:var(--text); letter-spacing:1px; }
    .logo span{color:var(--pink);}
    .nav-links{display:flex;gap:28px;align-items:center;}
    .nav-links a{font-family:var(--font-mono); font-size:13px; color:var(--text-dim); text-transform:uppercase; transition:color .2s; }
    .nav-links a:hover{color:var(--cyan);}
    section{padding:90px 5vw;position:relative;}
    .section-head{margin-bottom:44px;}
    .section-num{font-family:var(--font-mono);color:var(--pink);font-size:13px;letter-spacing:2px;}
    h2{font-family:var(--font-display); font-size:clamp(22px,3.4vw,38px); margin-top:10px; color:var(--text); }
    .section-desc{color:var(--text-dim);margin-top:12px;max-width:600px;font-size:15px;line-height:1.6;}
    .hero{min-height:70vh; display:flex;flex-direction:column;justify-content:center; padding:0 5vw; }
    h1.title{font-family:var(--font-display); font-size:clamp(32px, 6vw, 70px); color:var(--text); text-shadow:3px 3px 0 var(--pink), 6px 6px 0 var(--cyan); }
    .hero p.sub{font-size:18px; color:var(--text-dim); max-width:560px; margin-top:20px; }
    .post-form{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px; padding:28px;margin-bottom:36px; }
    .post-form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
    .post-form input, .post-form textarea{width:100%;background:var(--bg-2);border:1px solid var(--panel-border);color:var(--text); padding:12px 14px;border-radius:8px;font-family:var(--font-body);font-size:14px; }
    .post-form textarea{min-height:90px;resize:vertical;margin-bottom:14px;}
    .btn{font-family:var(--font-mono); font-weight:600; font-size:14px; padding:14px 26px; border-radius:8px; cursor:pointer; background:var(--pink); color:#fff; border:none; }
    .feed{display:flex;flex-direction:column;gap:14px;}
    .post-card{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px; padding:20px 22px; }
    .post-card .top{display:flex;justify-content:space-between;margin-bottom:8px;font-family:var(--font-mono);font-size:13px;}
    .post-card .name{color:var(--cyan);font-weight:600;}
    .post-card .game{color:var(--gold);}
    .grid-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
    .card{background:var(--panel);border:1px solid var(--panel-border);padding:20px;border-radius:12px;}
  </style>
</head>
<body>

  <nav>
    <div class="logo">DAMIA<span>PRODAN</span></div>
    <div class="nav-links">
      <a href="#vivo">Vivo</a>
      <a href="#ranking">Top Juegos</a>
      <a href="#videos">Videos</a>
      <a href="#comunidad">Comunidad</a>
    </div>
  </nav>

  <section class="hero">
    <h1 class="title">DAMIA PRODAN</h1>
    <p class="sub">Streams en vivo, rankings de juegos y opiniones de la comunidad.</p>
  </section>

  <!-- 03 - RANKING DE JUEGOS -->
  <section id="ranking">
    <div class="section-head">
      <div class="section-num">03 — RANKING</div>
      <h2>Top Juegos Jugados</h2>
      <p class="section-desc">Los juegos más hablados en el canal.</p>
    </div>
    <div id="top-games-list" class="grid-list"></div>
  </section>

  <!-- 04 - TOP VIDEOS -->
  <section id="videos">
    <div class="section-head">
      <div class="section-num">04 — VIDEOS</div>
      <h2>Top Videos YouTube</h2>
    </div>
    <div id="top-videos-list" class="grid-list"></div>
  </section>

  <!-- COMUNIDAD / RESEÑAS -->
  <section id="comunidad">
    <div class="section-head">
      <div class="section-num">05 — COMUNIDAD</div>
      <h2>Opiniones de la Comunidad</h2>
    </div>

    <div class="post-form">
      <div class="row">
        <input type="text" id="fName" placeholder="Tu Nombre / Nick" required>
        <input type="text" id="fGame" placeholder="Juego sobre el que opinás" required>
      </div>
      <textarea id="fBody" placeholder="Escribí tu reseña..." required></textarea>
      <button type="button" id="submitPost" class="btn">Publicar Reseña</button>
    </div>

    <div id="feed" class="feed"></div>
  </section>

  <script>
    // 1. Cargar Ranking de Juegos (TOP_GAMES)
    const TOP_GAMES = [
      { name: "Counter-Strike 2", desc: "El clásico de siempre en el canal." },
      { name: "GTA V / RP", desc: "Momentos épicos con la comunidad." },
      { name: "Elden Ring", desc: "Desafíos e intentos infinitos." }
    ];

    function loadTopGames() {
      const container = document.getElementById('top-games-list');
      if (container) {
        container.innerHTML = TOP_GAMES.map(g => `
          <div class="card">
            <h3>${g.name}</h3>
            <p style="color:var(--text-dim); margin-top:8px; font-size:14px;">${g.desc}</p>
          </div>
        `).join('');
      }
    }

    // 2. Cargar Videos de YouTube
    async function loadTopVideos() {
      const container = document.getElementById('top-videos-list');
      if (!container) return;
      try {
        const res = await fetch('/api/top-videos');
        if (res.ok) {
          const videos = await res.json();
          container.innerHTML = videos.map(v => `
            <div class="card">
              <h3>${v.title}</h3>
              <a href="${v.url}" target="_blank" style="color:var(--cyan); display:inline-block; margin-top:10px;">Ver en YouTube →</a>
            </div>
          `).join('');
        }
      } catch (e) {
        container.innerHTML = `<p style="color:var(--text-dim);">Conectando canal de YouTube...</p>`;
      }
    }

    // 3. Cargar y guardar Reseñas en Neon PostgreSQL
    async function loadReviews() {
      try {
        const res = await fetch('/api/reviews');
        const reviews = await res.json();
        const feed = document.getElementById('feed');
        if (!feed) return;

        if (Array.isArray(reviews) && reviews.length > 0) {
          feed.innerHTML = reviews.map(r => `
            <div class="post-card">
              <div class="top">
                <span class="name">${r.author}</span>
                <span class="game">${r.game}</span>
              </div>
              <div>${r.comment}</div>
            </div>
          `).join('');
        } else {
          feed.innerHTML = '<div style="color:var(--text-dim);">No hay reseñas todavía. ¡Sé el primero!</div>';
        }
      } catch (err) {
        console.error('Error al cargar reseñas:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadTopGames();
      loadTopVideos();
      loadReviews();

      const submitBtn = document.getElementById('submitPost');
      if (submitBtn) {
        submitBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          const author = document.getElementById('fName')?.value;
          const game = document.getElementById('fGame')?.value;
          const comment = document.getElementById('fBody')?.value;

          if (!author || !game || !comment) {
            alert('Por favor completá todos los campos.');
            return;
          }

          const res = await fetch('/api/reviews', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ author, game, comment, rating: 5 })
          });

          if (res.ok) {
            document.getElementById('fName').value = '';
            document.getElementById('fGame').value = '';
            document.getElementById('fBody').value = '';
loadReviews();
        } else {
          alert('Error al guardar la reseña.');
        }
      });
    }
}
});
</script>
</body>
</html>
